name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # zapier-platform-core 18+ requires Node 22+. Keeping the matrix
        # so a future 23/24 addition is a one-line change.
        node-version: ['22']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Zapier validate (schema + integration checks)
        run: npx zapier validate
